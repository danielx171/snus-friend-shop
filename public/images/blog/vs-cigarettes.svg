<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0c1018" />

  <!-- Left - Clean pouch with green glow -->
  <circle cx="200" cy="180" r="80" fill="#a3e635" opacity="0.05" />
  <circle cx="200" cy="180" r="60" fill="#a3e635" opacity="0.08" />
  <ellipse cx="200" cy="180" rx="40" ry="18" fill="white" />
  <text x="200" y="184" text-anchor="middle" font-size="10" fill="#64748b" font-family="system-ui">NICOTINE POUCH</text>
  <!-- Green checkmark -->
  <circle cx="200" cy="130" r="16" fill="#a3e635" />
  <path d="M192 130 L198 136 L210 124" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" />

  <text x="200" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#a3e635" font-family="system-ui">0 harmful chemicals</text>
  <text x="200" y="310" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">No tar, no carbon monoxide</text>
  <text x="200" y="330" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">No secondhand exposure</text>

  <!-- VS divider -->
  <line x1="400" y1="40" x2="400" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="400" cy="180" r="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="400" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8" font-family="system-ui">VS</text>

  <!-- Right - Cigarette with red X -->
  <g transform="translate(540, 140)">
    <rect x="0" y="30" width="120" height="12" rx="2" fill="#fef3c7" />
    <rect x="0" y="30" width="25" height="12" rx="2" fill="#f97316" />
    <path d="M125 30 Q130 20 128 10 Q132 0 127 -10" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.2" />
    <path d="M120 28 Q126 15 122 5 Q128 -8 124 -18" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.15" />
    <circle cx="60" cy="36" r="30" fill="#ef4444" opacity="0.15" />
    <line x1="40" y1="16" x2="80" y2="56" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="16" x2="40" y2="56" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="600" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#ef4444" font-family="system-ui">7,000+ chemicals</text>
  <text x="600" y="310" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">70+ known carcinogens</text>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Harms bystanders</text>
</svg>
