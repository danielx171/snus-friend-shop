<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sw-arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0c1018" />

  <!-- Journey path -->
  <path d="M100 200 Q250 200 400 200 Q550 200 700 200" stroke="#334155" stroke-width="2" stroke-dasharray="8 4" />

  <!-- Start: Cigarette (fading/breaking) -->
  <g transform="translate(100, 160)">
    <rect x="0" y="20" width="80" height="10" rx="2" fill="#fef3c7" opacity="0.5" />
    <rect x="0" y="20" width="18" height="10" rx="2" fill="#f97316" opacity="0.5" />
    <line x1="50" y1="18" x2="55" y2="32" stroke="#ef4444" stroke-width="2" />
    <path d="M85 20 Q88 12 86 5" stroke="#64748b" stroke-width="1" fill="none" opacity="0.2" />
    <circle cx="40" cy="25" r="20" fill="#ef4444" opacity="0.1" />
    <line x1="28" y1="13" x2="52" y2="37" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="52" y1="13" x2="28" y2="37" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <text x="40" y="70" text-anchor="middle" font-size="11" fill="#ef4444" font-family="system-ui">Before</text>
  </g>

  <!-- Middle: Transformation arrow -->
  <g transform="translate(320, 175)">
    <path d="M0 25 L120 25" stroke="url(#sw-arrow)" stroke-width="3" />
    <path d="M110 18 L125 25 L110 32" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="55" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">Your journey</text>
  </g>

  <!-- End: Clean pouch with green glow -->
  <g transform="translate(580, 155)">
    <circle cx="40" cy="30" r="45" fill="#a3e635" opacity="0.05" />
    <circle cx="40" cy="30" r="30" fill="#a3e635" opacity="0.08" />
    <ellipse cx="40" cy="30" rx="30" ry="14" fill="white" />
    <text x="40" y="34" text-anchor="middle" font-size="8" fill="#64748b" font-family="system-ui">NICOTINE POUCH</text>
    <circle cx="40" cy="-10" r="12" fill="#a3e635" />
    <path d="M34 -10 L38 -6 L47 -15" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="40" y="70" text-anchor="middle" font-size="11" fill="#a3e635" font-family="system-ui">After</text>
  </g>

  <!-- Benefits along the path (pre-computed from i*130 offset at translate(250,260)) -->
  <!-- i=0: x=250, color=#facc15 -->
  <circle cx="250" cy="270" r="4" fill="#facc15" opacity="0.6" />
  <text x="250" y="290" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui">Week 1: Taste improves</text>

  <!-- i=1: x=380, color=#facc15 -->
  <circle cx="380" cy="270" r="4" fill="#facc15" opacity="0.6" />
  <text x="380" y="290" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui">Week 2: Breathing easier</text>

  <!-- i=2: x=510, color=#a3e635 -->
  <circle cx="510" cy="270" r="4" fill="#a3e635" opacity="0.6" />
  <text x="510" y="290" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui">Month 1: Energy returns</text>

  <!-- i=3: x=640, color=#a3e635 -->
  <circle cx="640" cy="270" r="4" fill="#a3e635" opacity="0.6" />
  <text x="640" y="290" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui">Month 3: Cigarette-free</text>

  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">Thousands have made the switch &#x2014; here's how to do it right</text>
</svg>
