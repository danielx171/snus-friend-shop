<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="zyh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>

    <!-- ZYN brand blue gradient -->
    <linearGradient id="zyh-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#0087c1" />
    </linearGradient>

    <!-- Low risk - green gradient -->
    <linearGradient id="zyh-low-risk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Moderate risk - orange gradient -->
    <linearGradient id="zyh-moderate-risk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- High risk - red-orange gradient -->
    <linearGradient id="zyh-high-risk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ee5a6f" />
    </linearGradient>

    <!-- Risk meter gradient (left to right) -->
    <linearGradient id="zyh-risk-meter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ff6b6b" />
    </linearGradient>

    <!-- Heartbeat line gradient -->
    <linearGradient id="zyh-heartbeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" opacity="0.8" />
      <stop offset="50%" stop-color="#a3e635" opacity="0.4" />
      <stop offset="100%" stop-color="#a3e635" opacity="0.8" />
    </linearGradient>

    <!-- Arrow marker for risk indicators -->
    <marker id="zyh-arrow" marker-width="10" marker-height="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#a3e635" opacity="0.6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#zyh-bg)" />

  <!-- Title section -->
  <text
    x="400"
    y="35"
    text-anchor="middle"
    font-size="12"
    font-weight="700"
    fill="#94a3b8"
    font-family="system-ui"
    letter-spacing="2"
  >
    ZYN Health Profile
  </text>

  <!-- Divider line -->
  <line x1="250" y1="45" x2="550" y2="45" stroke="#334155" stroke-width="1" />

  <!-- CAN 1: 3MG (LOW RISK) -->
  <g transform="translate(100, 80)">
    <!-- Can card background -->
    <rect x="0" y="0" width="140" height="220" fill="#1e293b" stroke="#334155" stroke-width="1" rx="4" />

    <!-- Top ellipse -->
    <ellipse cx="70" cy="35" rx="40" ry="12" fill="#86efac" opacity="0.8" />
    <ellipse cx="70" cy="35" rx="36" ry="9" fill="url(#zyh-low-risk)" />

    <!-- Can body -->
    <rect x="30" y="35" width="80" height="65" fill="url(#zyh-low-risk)" rx="2" />

    <!-- Can bottom -->
    <ellipse cx="70" cy="100" rx="40" ry="12" fill="#22c55e" opacity="0.6" />

    <!-- ZYN logo text on can -->
    <text x="70" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="system-ui">
      ZYN
    </text>

    <!-- Strength label -->
    <text x="70" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white" opacity="0.9" font-family="system-ui">
      3mg
    </text>

    <!-- Risk label below can -->
    <text x="70" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac" font-family="system-ui">
      LOW RISK
    </text>

    <!-- Risk meter bar -->
    <rect x="20" y="150" width="100" height="6" fill="#0c1018" stroke="#334155" stroke-width="1" rx="2" />
    <rect x="20" y="150" width="25" height="6" fill="url(#zyh-risk-meter)" rx="2" />

    <!-- Risk percentage -->
    <text x="70" y="175" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">
      ~15% addiction risk
    </text>

    <!-- Checkmark badge -->
    <circle cx="115" cy="20" r="14" fill="#22c55e" opacity="0.8" />
    <text x="115" y="28" text-anchor="middle" font-size="16" fill="white" font-family="system-ui">
      ✓
    </text>
  </g>

  <!-- CAN 2: 6MG (MODERATE RISK) -->
  <g transform="translate(330, 80)">
    <!-- Can card background -->
    <rect x="0" y="0" width="140" height="220" fill="#1e293b" stroke="#334155" stroke-width="1" rx="4" />

    <!-- Top ellipse -->
    <ellipse cx="70" cy="35" rx="40" ry="12" fill="#00A3E0" opacity="0.85" />
    <ellipse cx="70" cy="35" rx="36" ry="9" fill="url(#zyh-blue)" />

    <!-- Can body -->
    <rect x="30" y="35" width="80" height="65" fill="url(#zyh-blue)" rx="2" />

    <!-- Can bottom -->
    <ellipse cx="70" cy="100" rx="40" ry="12" fill="#0087c1" opacity="0.6" />

    <!-- ZYN logo -->
    <text x="70" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="system-ui">
      ZYN
    </text>

    <!-- Strength label -->
    <text x="70" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white" opacity="0.95" font-family="system-ui">
      6mg
    </text>

    <!-- Risk label -->
    <text x="70" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#fb923c" font-family="system-ui">
      MODERATE
    </text>

    <!-- Risk meter bar -->
    <rect x="20" y="150" width="100" height="6" fill="#0c1018" stroke="#334155" stroke-width="1" rx="2" />
    <rect x="20" y="150" width="55" height="6" fill="url(#zyh-risk-meter)" rx="2" />

    <!-- Risk percentage -->
    <text x="70" y="175" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">
      ~30% addiction risk
    </text>

    <!-- Caution indicator -->
    <circle cx="115" cy="20" r="14" fill="#fb923c" opacity="0.8" />
    <text x="115" y="25" text-anchor="middle" font-size="18" fill="white" font-weight="700" font-family="system-ui">
      !
    </text>
  </g>

  <!-- CAN 3: 11MG (HIGHER RISK) -->
  <g transform="translate(560, 80)">
    <!-- Can card background -->
    <rect x="0" y="0" width="140" height="220" fill="#1e293b" stroke="#334155" stroke-width="1" rx="4" />

    <!-- Top ellipse -->
    <ellipse cx="70" cy="35" rx="40" ry="12" fill="#ff6b6b" opacity="0.85" />
    <ellipse cx="70" cy="35" rx="36" ry="9" fill="url(#zyh-high-risk)" />

    <!-- Can body -->
    <rect x="30" y="35" width="80" height="65" fill="url(#zyh-high-risk)" rx="2" />

    <!-- Can bottom -->
    <ellipse cx="70" cy="100" rx="40" ry="12" fill="#ee5a6f" opacity="0.6" />

    <!-- ZYN logo -->
    <text x="70" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="system-ui">
      ZYN
    </text>

    <!-- Strength label -->
    <text x="70" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="white" opacity="0.95" font-family="system-ui">
      11mg
    </text>

    <!-- Risk label -->
    <text x="70" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#ff6b6b" font-family="system-ui">
      HIGHER RISK
    </text>

    <!-- Risk meter bar -->
    <rect x="20" y="150" width="100" height="6" fill="#0c1018" stroke="#334155" stroke-width="1" rx="2" />
    <rect x="20" y="150" width="85" height="6" fill="url(#zyh-risk-meter)" rx="2" />

    <!-- Risk percentage -->
    <text x="70" y="175" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">
      ~50% addiction risk
    </text>

    <!-- Alert indicator -->
    <circle cx="115" cy="20" r="14" fill="#ff6b6b" opacity="0.8" />
    <text x="115" y="27" text-anchor="middle" font-size="18" fill="white" font-weight="700" font-family="system-ui">
      ⚠
    </text>
  </g>

  <!-- BOTTOM SECTION -->

  <!-- Heartbeat line across bottom -->
  <g opacity="0.4">
    <path
      d="M 50 350 L 100 350 L 110 340 L 120 360 L 135 350 L 200 350 L 250 330 L 280 370 L 300 350 L 400 350 L 450 330 L 480 370 L 500 350 L 600 350 L 650 330 L 680 370 L 700 350 L 750 350"
      stroke="url(#zyh-heartbeat)"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Tobacco-free badge -->
  <g transform="translate(670, 310)">
    <!-- Shield background -->
    <path
      d="M 0 0 L 35 0 L 35 35 Q 18 50 0 35 Z"
      fill="#1e293b"
      stroke="#334155"
      stroke-width="1"
    />

    <!-- Checkmark -->
    <path d="M 8 18 L 14 24 L 28 10" stroke="#a3e635" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Label -->
    <text x="17" y="65" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui" font-weight="600">
      Tobacco-free
    </text>
  </g>

  <!-- Bottom info text -->
  <text
    x="400"
    y="390"
    text-anchor="middle"
    font-size="10"
    fill="#64748b"
    font-family="system-ui"
  >
    Health risk increases with nicotine strength. ZYNs are tobacco-free and contain pharmaceutical-grade nicotine.
  </text>
</svg>
