<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pablo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#1a0a0a" />
    </linearGradient>
    <radialGradient id="pablo-extreme-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" opacity="0.4" />
      <stop offset="100%" stop-color="#FF4500" opacity="0" />
    </radialGradient>
    <filter id="pablo-fire">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#pablo-bg-grad)" />

  <!-- Extreme glow effect around right can -->
  <ellipse cx="570" cy="220" rx="100" ry="120" fill="url(#pablo-extreme-glow)" />

  <!-- Title -->
  <text x="400" y="70" font-size="52" font-weight="700" fill="#FFD700" text-anchor="middle" font-family="system-ui">
    PABLO
  </text>
  <text x="400" y="105" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="system-ui" letter-spacing="1">
    10–50MG • EXTREME STRENGTH
  </text>

  <!-- Warning Triangle Icon -->
  <g transform="translate(680, 55)">
    <polygon points="0,-18 16,10 -16,10" fill="none" stroke="#FFD700" stroke-width="2" />
    <text x="0" y="3" font-size="16" fill="#FFD700" text-anchor="middle" font-weight="700">!</text>
  </g>

  <!-- Can 1: Silver 10mg (Small) -->
  <g transform="translate(150, 200)">
    <rect x="0" y="0" width="40" height="80" rx="3" fill="#c0c0c0" stroke="#334155" stroke-width="1" />
    <rect x="2" y="2" width="36" height="12" rx="1" fill="#e8e8e8" />
    <text x="20" y="50" font-size="7" fill="#1a1a1a" text-anchor="middle" font-weight="700">SILVER</text>
    <text x="20" y="62" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="600">10MG</text>
  </g>

  <!-- Can 2: Standard 25mg (Medium) -->
  <g transform="translate(310, 170)">
    <rect x="0" y="0" width="55" height="100" rx="3" fill="#FFD700" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="51" height="16" rx="2" fill="#FFED4E" />
    <circle cx="27.5" cy="35" r="12" fill="#FFC700" opacity="0.7" />
    <text x="27.5" y="65" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="700">STANDARD</text>
    <text x="27.5" y="77" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="600">25MG</text>
  </g>

  <!-- Can 3: Extreme 50mg (Large with glow) -->
  <g transform="translate(450, 130)" filter="url(#pablo-fire)">
    <rect x="0" y="0" width="75" height="130" rx="4" fill="#DC2626" stroke="#334155" stroke-width="2" />
    <rect x="3" y="3" width="69" height="22" rx="2" fill="#EF4444" />
    <circle cx="37.5" cy="50" r="16" fill="#FF6B35" opacity="0.8" />
    <polygon points="37.5,45 40,35 35,45 42,48 32,48" fill="#FFA500" opacity="0.9" />
    <text x="37.5" y="85" font-size="9" fill="#f1f5f9" text-anchor="middle" font-weight="700">EXTREME</text>
    <text x="37.5" y="100" font-size="10" fill="#fecaca" text-anchor="middle" font-weight="700">50MG</text>
  </g>

  <!-- Fire effect lines -->
  <g stroke="#FF6B35" stroke-width="2" opacity="0.6" filter="url(#pablo-fire)">
    <path d="M 520 200 Q 530 170 540 150" fill="none" />
    <path d="M 550 210 Q 560 180 570 160" fill="none" />
    <path d="M 580 200 Q 585 170 590 150" fill="none" />
  </g>
</svg>
