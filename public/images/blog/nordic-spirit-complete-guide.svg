<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ns-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <linearGradient id="ns-accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4FD" />
      <stop offset="100%" stop-color="#0066CC" />
    </linearGradient>
    <filter id="ns-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#ns-bg-grad)" />

  <!-- Title -->
  <text x="400" y="70" font-size="48" font-weight="700" fill="#0066CC" text-anchor="middle" font-family="system-ui">
    NORDIC SPIRIT
  </text>
  <text x="400" y="105" font-size="16" fill="#94a3b8" text-anchor="middle" font-family="system-ui" letter-spacing="1">
    BY JTI • UK #1
  </text>

  <!-- Union Jack Icon -->
  <g transform="translate(320, 60)">
    <rect width="20" height="16" fill="#0066CC" stroke="#f1f5f9" stroke-width="1" />
    <line x1="0" y1="0" x2="20" y2="16" stroke="#F1F5F9" stroke-width="1" />
    <line x1="20" y1="0" x2="0" y2="16" stroke="#F1F5F9" stroke-width="1" />
  </g>

  <!-- Can 1: Bergamot Wildberry (Purple) -->
  <g transform="translate(160, 150)">
    <rect x="0" y="0" width="60" height="120" rx="4" fill="#9333ea" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="56" height="20" rx="2" fill="#a855f7" />
    <circle cx="30" cy="35" r="18" fill="#c084fc" opacity="0.6" />
    <text x="30" y="90" font-size="10" fill="#f1f5f9" text-anchor="middle" font-weight="600">BERGAMOT</text>
    <text x="30" y="105" font-size="9" fill="#94a3b8" text-anchor="middle">WILDBERRY</text>
  </g>

  <!-- Can 2: Spearmint (Green) -->
  <g transform="translate(370, 150)">
    <rect x="0" y="0" width="60" height="120" rx="4" fill="#10b981" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="56" height="20" rx="2" fill="#34d399" />
    <circle cx="30" cy="35" r="18" fill="#6ee7b7" opacity="0.6" />
    <text x="30" y="90" font-size="10" fill="#f1f5f9" text-anchor="middle" font-weight="600">SPEARMINT</text>
    <text x="30" y="105" font-size="9" fill="#94a3b8" text-anchor="middle">Fresh Green</text>
  </g>

  <!-- Can 3: Frosty Mint (Icy Blue) -->
  <g transform="translate(580, 150)">
    <rect x="0" y="0" width="60" height="120" rx="4" fill="#0ea5e9" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="56" height="20" rx="2" fill="#38bdf8" />
    <circle cx="30" cy="35" r="18" fill="#7dd3fc" opacity="0.6" />
    <text x="30" y="90" font-size="10" fill="#f1f5f9" text-anchor="middle" font-weight="600">FROSTY</text>
    <text x="30" y="105" font-size="9" fill="#94a3b8" text-anchor="middle">MINT</text>
  </g>

  <!-- "12 FLAVOURS" Badge -->
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="30" fill="#a3e635" stroke="#84cc16" stroke-width="2" />
    <text x="0" y="-8" font-size="12" fill="#0c1018" text-anchor="middle" font-weight="700" font-family="system-ui">12</text>
    <text x="0" y="8" font-size="9" fill="#0c1018" text-anchor="middle" font-weight="600" font-family="system-ui">FLAVOURS</text>
  </g>
</svg>
