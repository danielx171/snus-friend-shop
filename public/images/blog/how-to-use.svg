<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="htu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#htu-bg)" />

  <!-- Step 1 - Open can -->
  <g transform="translate(80, 100)">
    <circle cx="80" cy="80" r="70" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <ellipse cx="80" cy="70" rx="35" ry="12" fill="#334155" />
    <rect x="45" y="70" width="70" height="30" fill="#334155" rx="2" />
    <ellipse cx="80" cy="100" rx="35" ry="12" fill="#475569" />
    <ellipse cx="80" cy="70" rx="30" ry="9" fill="#475569" />
    <ellipse cx="80" cy="58" rx="28" ry="8" fill="#64748b" transform="rotate(-15 80 58)" />
    <ellipse cx="75" cy="72" rx="8" ry="4" fill="#e2e8f0" />
    <ellipse cx="88" cy="74" rx="7" ry="4" fill="#e2e8f0" />
    <circle cx="135" cy="25" r="16" fill="#a3e635" />
    <text x="135" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#0c1018" font-family="system-ui">1</text>
    <text x="80" y="170" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="system-ui">Open the can</text>
  </g>

  <!-- Step 2 - Pick a pouch -->
  <g transform="translate(280, 100)">
    <circle cx="80" cy="80" r="70" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <path d="M60 90 Q55 70 65 55 Q70 48 78 50 L85 55 Q90 48 95 52 L98 60 Q102 55 106 60 L105 75 Q100 90 85 95 L65 95 Q58 95 60 90" fill="#f5d0a9" />
    <ellipse cx="80" cy="55" rx="12" ry="6" fill="white" stroke="#cbd5e1" stroke-width="1" />
    <text x="80" y="58" text-anchor="middle" font-size="6" fill="#94a3b8" font-family="system-ui">POUCH</text>
    <circle cx="135" cy="25" r="16" fill="#a3e635" />
    <text x="135" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#0c1018" font-family="system-ui">2</text>
    <text x="80" y="170" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="system-ui">Pick a pouch</text>
  </g>

  <!-- Step 3 - Place under lip -->
  <g transform="translate(480, 100)">
    <circle cx="80" cy="80" r="70" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <path d="M50 40 Q60 30 75 35 Q90 40 92 55 Q94 70 88 80 Q85 90 75 95 Q65 100 55 95 Q45 85 45 70 Q45 55 50 40" fill="#f5d0a9" />
    <path d="M55 72 Q70 68 85 72 Q85 78 70 80 Q55 78 55 72" fill="#e8a88a" />
    <ellipse cx="70" cy="73" rx="8" ry="3" fill="white" opacity="0.7" />
    <circle cx="68" cy="52" r="3" fill="#1e293b" />
    <path d="M100 60 L85 70" stroke="#a3e635" stroke-width="2" />
    <circle cx="102" cy="58" r="1" fill="#a3e635" />
    <circle cx="135" cy="25" r="16" fill="#a3e635" />
    <text x="135" y="31" text-anchor="middle" font-size="18" font-weight="700" fill="#0c1018" font-family="system-ui">3</text>
    <text x="80" y="170" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="system-ui">Place under lip</text>
  </g>

  <!-- Decorative elements -->
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui" letter-spacing="3">STEP-BY-STEP GUIDE</text>
  <line x1="300" y1="55" x2="500" y2="55" stroke="#334155" stroke-width="1" />

  <!-- Duration note -->
  <g transform="translate(650, 140)">
    <circle cx="40" cy="40" r="35" fill="#1e293b" stroke="#a3e635" stroke-width="1" opacity="0.5" />
    <text x="40" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#a3e635" font-family="system-ui">20</text>
    <text x="40" y="48" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui">MINUTES</text>
    <text x="40" y="90" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">Enjoy for</text>
    <text x="40" y="103" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">20-60 min</text>
  </g>
</svg>
