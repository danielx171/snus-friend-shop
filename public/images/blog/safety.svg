<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0c1018" />

  <!-- Central shield -->
  <g transform="translate(400, 190)">
    <path d="M0 -90 L65 -60 L65 20 Q65 70 0 100 Q-65 70 -65 20 L-65 -60 Z" fill="#1e293b" stroke="#a3e635" stroke-width="2" />
    <path d="M0 -75 L52 -50 L52 15 Q52 55 0 80 Q-52 55 -52 15 L-52 -50 Z" fill="#a3e635" opacity="0.08" />
    <!-- Checkmark -->
    <path d="M-20 5 L-5 20 L25 -15" stroke="#a3e635" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Data point: No tobacco (x=160, y=100) -->
  <circle cx="160" cy="100" r="28" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="160" y="98" text-anchor="middle" font-size="16" fill="#a3e635" font-family="system-ui">&#x2713;</text>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="system-ui">No tobacco</text>
  <line x1="160" y1="100" x2="400" y2="190" stroke="#334155" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Data point: No smoke (x=640, y=100) -->
  <circle cx="640" cy="100" r="28" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="640" y="98" text-anchor="middle" font-size="16" fill="#a3e635" font-family="system-ui">&#x2713;</text>
  <text x="640" y="144" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="system-ui">No smoke</text>
  <line x1="640" y1="100" x2="400" y2="190" stroke="#334155" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Data point: No tar (x=120, y=280) -->
  <circle cx="120" cy="280" r="28" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="120" y="278" text-anchor="middle" font-size="16" fill="#a3e635" font-family="system-ui">&#x2713;</text>
  <text x="120" y="324" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="system-ui">No tar</text>
  <line x1="120" y1="280" x2="400" y2="190" stroke="#334155" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Data point: No CO (x=680, y=280) -->
  <circle cx="680" cy="280" r="28" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="680" y="278" text-anchor="middle" font-size="16" fill="#a3e635" font-family="system-ui">&#x2713;</text>
  <text x="680" y="324" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="system-ui">No CO</text>
  <line x1="680" y1="280" x2="400" y2="190" stroke="#334155" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />

  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui" letter-spacing="2">EVIDENCE-BASED SAFETY OVERVIEW</text>
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">Based on published research and public health agency assessments</text>
</svg>
