<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skrufBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <linearGradient id="skrufCanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FBF85" />
      <stop offset="100%" stop-color="#2E8B57" />
    </linearGradient>
    <linearGradient id="skrufCanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A8E" />
      <stop offset="100%" stop-color="#5A3A5A" />
    </linearGradient>
    <linearGradient id="skrufCanLicorice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#skrufBg)" />

  <!-- Crown/Shield icon -->
  <g transform="translate(100, 45)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#C4A35A" stroke-width="1.5" />
    <polygon points="15,5 19,12 25,12 20,16 22,22 15,18 8,22 10,16 5,12 11,12" fill="#C4A35A" opacity="0.6" />
  </g>

  <!-- Title Section -->
  <text
    x="400"
    y="50"
    font-size="72"
    font-weight="900"
    text-anchor="middle"
    fill="#4A7C59"
    font-family="system-ui"
  >
    SKRUF
  </text>
  <text
    x="400"
    y="90"
    font-size="18"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="system-ui"
  >
    EST. 2002 • SWEDISH CRAFT
  </text>

  <!-- Can 1: Fresh Mint -->
  <g transform="translate(150, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#skrufCanMint)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#skrufCanMint)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#2E8B57" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="16"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      SKRUF
    </text>
    <rect x="18" y="70" width="34" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#C4A35A"
      font-family="system-ui"
    >
      S2
    </text>
  </g>

  <text
    x="185"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Fresh Mint
  </text>

  <!-- Can 2: Purple Cassice -->
  <g transform="translate(360, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#skrufCanPurple)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#skrufCanPurple)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#5A3A5A" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="16"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      SKRUF
    </text>
    <rect x="18" y="70" width="34" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#C4A35A"
      font-family="system-ui"
    >
      S3
    </text>
  </g>

  <text
    x="395"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Purple Cassice
  </text>

  <!-- Can 3: Nordic Licorice -->
  <g transform="translate(570, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#skrufCanLicorice)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#skrufCanLicorice)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#1A1A1A" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="16"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      SKRUF
    </text>
    <rect x="18" y="70" width="34" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#C4A35A"
      font-family="system-ui"
    >
      S4
    </text>
  </g>

  <text
    x="605"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Licorice
  </text>
</svg>
