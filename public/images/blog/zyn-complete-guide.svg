<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zynBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <linearGradient id="zynCanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0098CC" />
    </linearGradient>
    <linearGradient id="zynCanCitrus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <linearGradient id="zynCanCoffee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#5C2E0A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#zynBg)" />

  <!-- Title Section -->
  <text
    x="400"
    y="50"
    font-size="72"
    font-weight="900"
    text-anchor="middle"
    fill="#00A3E0"
    font-family="system-ui"
  >
    ZYN
  </text>
  <text
    x="400"
    y="90"
    font-size="20"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="system-ui"
  >
    52 PRODUCTS
  </text>

  <!-- Swedish flag mini-icon -->
  <g transform="translate(350, 65)">
    <rect width="20" height="14" fill="#006AA7" rx="2" />
    <rect width="6" height="14" x="8" fill="#FFCD00" />
    <rect width="20" height="6" y="5" fill="#FFCD00" />
  </g>

  <!-- #1 WORLDWIDE badge -->
  <circle cx="450" cy="70" r="20" fill="#a3e635" />
  <text
    x="450"
    y="75"
    font-size="12"
    font-weight="bold"
    text-anchor="middle"
    fill="#0c1018"
    font-family="system-ui"
  >
    #1
  </text>

  <!-- Can 1: Cool Mint -->
  <g transform="translate(150, 150)">
    <!-- Can body -->
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#zynCanMint)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#zynCanMint)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#0098CC" />
    <!-- Highlight -->
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <!-- ZYN branding -->
    <text
      x="35"
      y="50"
      font-size="20"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      ZYN
    </text>
    <!-- Strength badge -->
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      3MG
    </text>
  </g>

  <!-- Flavor label -->
  <text
    x="185"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Cool Mint
  </text>

  <!-- Can 2: Citrus -->
  <g transform="translate(360, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#zynCanCitrus)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#zynCanCitrus)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#FF9500" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="20"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      ZYN
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      3MG
    </text>
  </g>

  <text
    x="395"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Citrus
  </text>

  <!-- Can 3: Coffee -->
  <g transform="translate(570, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#zynCanCoffee)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#zynCanCoffee)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#5C2E0A" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="20"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      ZYN
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      3MG
    </text>
  </g>

  <text
    x="605"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Coffee
  </text>
</svg>
