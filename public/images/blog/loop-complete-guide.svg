<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <linearGradient id="loopCanLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FED56" />
      <stop offset="100%" stop-color="#5FCC37" />
    </linearGradient>
    <linearGradient id="loopCanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0098CC" />
    </linearGradient>
    <linearGradient id="loopCanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#5A189A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#loopBg)" />

  <!-- Lightning bolt icon -->
  <g transform="translate(120, 50)">
    <polygon points="15,0 25,20 15,25 20,40 0,15 10,10" fill="#FF6B35" opacity="0.7" />
  </g>

  <!-- Title Section -->
  <text
    x="400"
    y="50"
    font-size="72"
    font-weight="900"
    text-anchor="middle"
    fill="#FF6B35"
    font-family="system-ui"
  >
    LOOP
  </text>
  <text
    x="400"
    y="90"
    font-size="20"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="system-ui"
  >
    INSTANT RUSH
  </text>

  <!-- Eco leaf icon -->
  <g transform="translate(680, 55)">
    <ellipse cx="10" cy="10" rx="8" ry="12" fill="#2EC4B6" opacity="0.7" transform="rotate(-30 10 10)" />
    <path d="M 10 0 Q 15 5 15 10" stroke="#2EC4B6" stroke-width="2" fill="none" opacity="0.7" />
  </g>

  <!-- Can 1: Jalapeño Lime -->
  <g transform="translate(150, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#loopCanLime)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#loopCanLime)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#5FCC37" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="18"
      font-weight="bold"
      text-anchor="middle"
      fill="#1e293b"
      font-family="system-ui"
    >
      LOOP
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#FF6B35"
      font-family="system-ui"
    >
      16MG
    </text>
  </g>

  <text
    x="185"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Jalapeño Lime
  </text>

  <!-- Can 2: Mint Mania -->
  <g transform="translate(360, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#loopCanMint)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#loopCanMint)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#0098CC" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="18"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      LOOP
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      16MG
    </text>
  </g>

  <text
    x="395"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Mint Mania
  </text>

  <!-- Can 3: Salty Ludicris -->
  <g transform="translate(570, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#loopCanPurple)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#loopCanPurple)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#5A189A" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="18"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      LOOP
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      16MG
    </text>
  </g>

  <text
    x="605"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
  >
    Salty Ludicris
  </text>
</svg>
