<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg-meter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="25%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0c1018" />

  <!-- Strength meter bar -->
  <rect x="80" y="160" width="640" height="24" rx="12" fill="#1e293b" />
  <rect x="80" y="160" width="640" height="24" rx="12" fill="url(#sg-meter)" opacity="0.8" />

  <!-- Level: Light -->
  <line x1="120" y1="190" x2="120" y2="206" stroke="#86efac" stroke-width="2" />
  <text x="120" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#86efac" font-family="system-ui">Light</text>
  <text x="120" y="242" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">2-4mg</text>

  <!-- Level: Normal -->
  <line x1="240" y1="190" x2="240" y2="206" stroke="#a3e635" stroke-width="2" />
  <text x="240" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#a3e635" font-family="system-ui">Normal</text>
  <text x="240" y="242" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">4-6mg</text>

  <!-- Level: Strong -->
  <line x1="360" y1="190" x2="360" y2="206" stroke="#facc15" stroke-width="2" />
  <text x="360" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#facc15" font-family="system-ui">Strong</text>
  <text x="360" y="242" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">6-10mg</text>

  <!-- Level: X-Strong -->
  <line x1="500" y1="190" x2="500" y2="206" stroke="#f97316" stroke-width="2" />
  <text x="500" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#f97316" font-family="system-ui">X-Strong</text>
  <text x="500" y="242" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">10-16mg</text>

  <!-- Level: Ultra -->
  <line x1="640" y1="190" x2="640" y2="206" stroke="#ef4444" stroke-width="2" />
  <text x="640" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444" font-family="system-ui">Ultra</text>
  <text x="640" y="242" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui">16-50mg</text>

  <!-- Who it's for labels -->
  <text x="180" y="280" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">New users</text>
  <text x="360" y="280" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">Regular users</text>
  <text x="570" y="280" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="system-ui">Experienced only</text>

  <!-- START HERE pointer -->
  <g transform="translate(240, 120)">
    <path d="M0 30 L-8 10 L8 10 Z" fill="#a3e635" />
    <rect x="-45" y="-8" width="90" height="20" rx="4" fill="#a3e635" />
    <text x="0" y="6" text-anchor="middle" font-size="10" font-weight="600" fill="#0c1018" font-family="system-ui">START HERE</text>
  </g>

  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#64748b" font-family="system-ui" letter-spacing="2">NICOTINE STRENGTH GUIDE</text>
  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Higher mg does not mean better. Find the strength that matches your tolerance.</text>
</svg>
