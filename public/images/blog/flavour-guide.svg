<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0c1018" />

  <!--
    Flavour wheel centred at (400, 200).
    8 segments, each 45 degrees. r=120 for segments, r=150 for labels.
    Segment i starts at angle (i*45 - 22.5) and ends at (i*45 + 22.5).

    Pre-computed arc endpoints (r=120):
      angle=0:    start=-22.5°  x1=110.85,y1=-45.96   end=22.5°   x2=110.85,y2=45.96
      angle=45:   start=22.5°   x1=110.85,y1=45.96    end=67.5°   x2=45.96,y2=110.85
      angle=90:   start=67.5°   x1=45.96,y1=110.85    end=112.5°  x2=-45.96,y2=110.85
      angle=135:  start=112.5°  x1=-45.96,y1=110.85   end=157.5°  x2=-110.85,y2=45.96
      angle=180:  start=157.5°  x1=-110.85,y1=45.96   end=202.5°  x2=-110.85,y2=-45.96
      angle=225:  start=202.5°  x1=-110.85,y1=-45.96  end=247.5°  x2=-45.96,y2=-110.85
      angle=270:  start=247.5°  x1=-45.96,y1=-110.85  end=292.5°  x2=45.96,y2=-110.85
      angle=315:  start=292.5°  x1=45.96,y1=-110.85   end=337.5°  x2=110.85,y2=-45.96

    Label positions (r=150):
      0°:   (150, 0)
      45°:  (106.07, 106.07)
      90°:  (0, 150)
      135°: (-106.07, 106.07)
      180°: (-150, 0)
      225°: (-106.07, -106.07)
      270°: (0, -150)
      315°: (106.07, -106.07)
  -->

  <g transform="translate(400, 200)">
    <!-- Segment 0: Mint, angle=0, color=#86efac -->
    <path d="M0 0 L110.85 -45.96 A120 120 0 0 1 110.85 45.96 Z" fill="#86efac" opacity="0.15" stroke="#86efac" stroke-width="1" stroke-opacity="0.3" />
    <text x="150" y="-4" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac" font-family="system-ui">Mint</text>
    <text x="150" y="10" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Cool &amp; fresh</text>

    <!-- Segment 1: Berry, angle=45, color=#f87171 -->
    <path d="M0 0 L110.85 45.96 A120 120 0 0 1 45.96 110.85 Z" fill="#f87171" opacity="0.15" stroke="#f87171" stroke-width="1" stroke-opacity="0.3" />
    <text x="106.07" y="102.07" text-anchor="middle" font-size="12" font-weight="600" fill="#f87171" font-family="system-ui">Berry</text>
    <text x="106.07" y="116.07" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Sweet &amp; fruity</text>

    <!-- Segment 2: Citrus, angle=90, color=#fbbf24 -->
    <path d="M0 0 L45.96 110.85 A120 120 0 0 1 -45.96 110.85 Z" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3" />
    <text x="0" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24" font-family="system-ui">Citrus</text>
    <text x="0" y="160" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Bright &amp; tangy</text>

    <!-- Segment 3: Tropical, angle=135, color=#fb923c -->
    <path d="M0 0 L-45.96 110.85 A120 120 0 0 1 -110.85 45.96 Z" fill="#fb923c" opacity="0.15" stroke="#fb923c" stroke-width="1" stroke-opacity="0.3" />
    <text x="-106.07" y="102.07" text-anchor="middle" font-size="12" font-weight="600" fill="#fb923c" font-family="system-ui">Tropical</text>
    <text x="-106.07" y="116.07" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Exotic &amp; sweet</text>

    <!-- Segment 4: Coffee, angle=180, color=#a78bfa -->
    <path d="M0 0 L-110.85 45.96 A120 120 0 0 1 -110.85 -45.96 Z" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3" />
    <text x="-150" y="-4" text-anchor="middle" font-size="12" font-weight="600" fill="#a78bfa" font-family="system-ui">Coffee</text>
    <text x="-150" y="10" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Rich &amp; warm</text>

    <!-- Segment 5: Tobacco, angle=225, color=#1e293b (dark, shown lighter) -->
    <path d="M0 0 L-110.85 -45.96 A120 120 0 0 1 -45.96 -110.85 Z" fill="#94a3b8" opacity="0.15" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3" />
    <text x="-106.07" y="-110.07" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8" font-family="system-ui">Tobacco</text>
    <text x="-106.07" y="-96.07" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Classic &amp; earthy</text>

    <!-- Segment 6: Ice, angle=270, color=#38bdf8 -->
    <path d="M0 0 L-45.96 -110.85 A120 120 0 0 1 45.96 -110.85 Z" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <text x="0" y="-154" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8" font-family="system-ui">Ice</text>
    <text x="0" y="-140" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Pure cooling</text>

    <!-- Segment 7: Floral, angle=315, color=#f472b6 -->
    <path d="M0 0 L45.96 -110.85 A120 120 0 0 1 110.85 -45.96 Z" fill="#f472b6" opacity="0.15" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3" />
    <text x="106.07" y="-110.07" text-anchor="middle" font-size="12" font-weight="600" fill="#f472b6" font-family="system-ui">Floral</text>
    <text x="106.07" y="-96.07" text-anchor="middle" font-size="9" fill="#64748b" font-family="system-ui">Delicate &amp; soft</text>

    <!-- Center label -->
    <circle cx="0" cy="0" r="35" fill="#161d2b" stroke="#334155" stroke-width="1" />
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#f1f5f9" font-family="system-ui">FLAVOUR</text>
    <text x="0" y="10" text-anchor="middle" font-size="10" font-weight="600" fill="#f1f5f9" font-family="system-ui">WHEEL</text>
  </g>
</svg>
