<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="on-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <filter id="on-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#on-bg-grad)" />

  <!-- Title -->
  <text x="400" y="70" font-size="56" font-weight="700" fill="#FF4500" text-anchor="middle" font-family="system-ui">
    ON!
  </text>
  <text x="400" y="105" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="system-ui" letter-spacing="1">
    NICOSILK TECHNOLOGY
  </text>

  <!-- BY ALTRIA text -->
  <text x="120" y="95" font-size="11" fill="#64748b" font-family="system-ui">BY ALTRIA</text>

  <!-- LEFT SIDE: CLASSIC -->
  <text x="200" y="130" font-size="13" fill="#a3e635" text-anchor="middle" font-weight="600" font-family="system-ui">CLASSIC</text>

  <!-- Can 1: Classic Mint -->
  <g transform="translate(130, 160)">
    <rect x="0" y="0" width="50" height="100" rx="3" fill="#2dd4bf" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="46" height="16" rx="2" fill="#67e8f9" />
    <text x="25" y="65" font-size="8" fill="#0c1018" text-anchor="middle" font-weight="700">CLASSIC</text>
    <text x="25" y="78" font-size="8" fill="#0c1018" text-anchor="middle">MINT</text>
    <text x="25" y="90" font-size="8" fill="#0c1018" text-anchor="middle" font-weight="600">3MG</text>
  </g>

  <!-- Can 2: Classic Coffee -->
  <g transform="translate(220, 160)">
    <rect x="0" y="0" width="50" height="100" rx="3" fill="#78350f" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="46" height="16" rx="2" fill="#a16207" />
    <text x="25" y="65" font-size="8" fill="#fef3c7" text-anchor="middle" font-weight="700">CLASSIC</text>
    <text x="25" y="78" font-size="8" fill="#fef3c7" text-anchor="middle">COFFEE</text>
    <text x="25" y="90" font-size="8" fill="#fef3c7" text-anchor="middle" font-weight="600">3MG</text>
  </g>

  <!-- RIGHT SIDE: PLUS (with lightning bolt) -->
  <g transform="translate(530, 120)">
    <text x="0" y="0" font-size="13" fill="#a3e635" text-anchor="middle" font-weight="600" font-family="system-ui">PLUS</text>
    <!-- Lightning bolt -->
    <polygon points="15,0 20,-8 10,-8 15,5 5,5 15,15" fill="#a3e635" />
  </g>

  <!-- Can 3: PLUS Mint -->
  <g transform="translate(480, 160)">
    <rect x="0" y="0" width="50" height="100" rx="3" fill="#06b6d4" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="46" height="16" rx="2" fill="#22d3ee" />
    <rect x="0" y="0" width="50" height="100" rx="3" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.5" />
    <text x="25" y="65" font-size="8" fill="#0c1018" text-anchor="middle" font-weight="700">PLUS</text>
    <text x="25" y="78" font-size="8" fill="#0c1018" text-anchor="middle">MINT</text>
    <text x="25" y="90" font-size="8" fill="#0c1018" text-anchor="middle" font-weight="600">6MG</text>
  </g>

  <!-- Can 4: PLUS Berry -->
  <g transform="translate(570, 160)">
    <rect x="0" y="0" width="50" height="100" rx="3" fill="#d946ef" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="46" height="16" rx="2" fill="#f472b6" />
    <rect x="0" y="0" width="50" height="100" rx="3" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.5" />
    <text x="25" y="65" font-size="8" fill="#f1f5f9" text-anchor="middle" font-weight="700">PLUS</text>
    <text x="25" y="78" font-size="8" fill="#f1f5f9" text-anchor="middle">BERRY</text>
    <text x="25" y="90" font-size="8" fill="#f1f5f9" text-anchor="middle" font-weight="600">6MG</text>
  </g>

  <!-- BEST VALUE Badge -->
  <g transform="translate(680, 85)">
    <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#FF4500" stroke="#ff6b35" stroke-width="1.5" />
    <text x="0" y="-5" font-size="11" fill="#f1f5f9" text-anchor="middle" font-weight="700" font-family="system-ui">BEST VALUE</text>
    <text x="0" y="10" font-size="8" fill="#fecaca" text-anchor="middle" font-family="system-ui">Great Taste</text>
  </g>
</svg>
