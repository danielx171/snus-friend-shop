<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="siberia-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <linearGradient id="siberia-frost-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#0088CC" />
    </linearGradient>
    <filter id="siberia-frost">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#siberia-bg-grad)" />

  <!-- Snowflake decorations -->
  <g stroke="#00BFFF" stroke-width="1.5" opacity="0.4" filter="url(#siberia-frost)">
    <!-- Top left snowflake -->
    <g transform="translate(120, 80)">
      <line x1="0" y1="-12" x2="0" y2="12" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-8" y1="-8" x2="8" y2="8" />
      <line x1="-8" y1="8" x2="8" y2="-8" />
    </g>
    <!-- Top right snowflake -->
    <g transform="translate(680, 90)">
      <line x1="0" y1="-12" x2="0" y2="12" />
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="-8" y1="-8" x2="8" y2="8" />
      <line x1="-8" y1="8" x2="8" y2="-8" />
    </g>
  </g>

  <!-- Title and Subtitle -->
  <text x="400" y="70" font-size="56" font-weight="700" fill="#00BFFF" text-anchor="middle" font-family="system-ui">
    SIBERIA
  </text>
  <text x="400" y="115" font-size="32" font-weight="600" fill="#a3e635" text-anchor="middle" font-family="system-ui" letter-spacing="2">
    -80°C
  </text>
  <text x="400" y="145" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="system-ui">LEGENDARY EXTREME • CULT CLASSIC</text>

  <!-- Can 1: Ultra Slim 16.5mg -->
  <g transform="translate(120, 210)">
    <rect x="0" y="0" width="35" height="70" rx="2" fill="#00BFFF" stroke="#ffffff" stroke-width="1" />
    <rect x="2" y="2" width="31" height="10" rx="1" fill="#7dd3fc" />
    <text x="17.5" y="45" font-size="7" fill="#0c1018" text-anchor="middle" font-weight="600">ULTRA</text>
    <text x="17.5" y="55" font-size="7" fill="#0c1018" text-anchor="middle" font-weight="600">SLIM</text>
    <text x="17.5" y="64" font-size="6" fill="#0c1018" text-anchor="middle">16.5mg</text>
  </g>

  <!-- Can 2: Slim 25mg -->
  <g transform="translate(240, 180)">
    <rect x="0" y="0" width="45" height="90" rx="2" fill="#0099CC" stroke="#ffffff" stroke-width="1" />
    <rect x="2" y="2" width="41" height="13" rx="1" fill="#38bdf8" />
    <text x="22.5" y="50" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="600">SLIM</text>
    <text x="22.5" y="62" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="600">25MG</text>
  </g>

  <!-- Can 3: Portion 33mg -->
  <g transform="translate(370, 150)">
    <rect x="0" y="0" width="55" height="110" rx="3" fill="#0066FF" stroke="#ffffff" stroke-width="1.5" />
    <rect x="2" y="2" width="51" height="16" rx="2" fill="#0ea5e9" />
    <text x="27.5" y="65" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">PORTION</text>
    <text x="27.5" y="80" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">33MG</text>
  </g>

  <!-- Can 4: Maxi 49.5mg (Largest, most extreme) -->
  <g transform="translate(500, 110)">
    <rect x="0" y="0" width="70" height="140" rx="3" fill="#0044BB" stroke="#ffffff" stroke-width="2" />
    <rect x="2" y="2" width="66" height="20" rx="2" fill="#0ea5e9" />
    <rect x="0" y="0" width="70" height="140" rx="3" fill="none" stroke="#00BFFF" stroke-width="1.5" opacity="0.6" filter="url(#siberia-frost)" />
    <text x="35" y="75" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">MAXI</text>
    <text x="35" y="92" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">49.5MG</text>
    <text x="35" y="105" font-size="7" fill="#a3e635" text-anchor="middle" font-weight="600">EXTREME</text>
  </g>

  <!-- Temperature Gauge -->
  <g transform="translate(670, 200)">
    <rect x="-15" y="-50" width="30" height="100" rx="4" fill="none" stroke="#00BFFF" stroke-width="1.5" />
    <rect x="-13" y="-20" width="26" height="48" fill="#00BFFF" opacity="0.4" />
    <circle cx="0" cy="-18" r="4" fill="#a3e635" />
  </g>
</svg>
