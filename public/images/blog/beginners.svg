<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0c1018" />

  <!-- Welcoming arcs -->
  <path d="M100 350 Q400 50 700 350" stroke="#a3e635" stroke-width="2" fill="none" opacity="0.15" />
  <path d="M150 350 Q400 100 650 350" stroke="#a3e635" stroke-width="1" fill="none" opacity="0.1" />

  <!-- Beginner badge -->
  <circle cx="400" cy="80" r="30" fill="#a3e635" opacity="0.1" />
  <circle cx="400" cy="80" r="22" fill="#a3e635" opacity="0.15" />
  <text x="400" y="76" text-anchor="middle" font-size="18" fill="#a3e635" font-family="system-ui">&#x1F331;</text>
  <text x="400" y="96" text-anchor="middle" font-size="9" fill="#a3e635" font-family="system-ui" font-weight="600">BEGINNER</text>

  <!-- Can 1: Mild (x=180, i=0) -->
  <g transform="translate(130, 140)">
    <rect x="0" y="20" width="100" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="0" y="20" width="100" height="4" rx="2" fill="#86efac" />
    <text x="50" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9" font-family="system-ui">Mild</text>
    <text x="50" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#86efac" font-family="system-ui">4mg</text>
    <!-- Strength dots: i=0, dot 0 filled, 1-4 empty -->
    <circle cx="25" cy="108" r="4" fill="#86efac" />
    <circle cx="37" cy="108" r="3" fill="#334155" />
    <circle cx="49" cy="108" r="3" fill="#334155" />
    <circle cx="61" cy="108" r="3" fill="#334155" />
    <circle cx="73" cy="108" r="3" fill="#334155" />
  </g>

  <!-- Arrow 1→2 -->
  <text x="310" y="195" text-anchor="middle" font-size="16" fill="#334155" font-family="system-ui">&#x2192;</text>

  <!-- Can 2: Normal (x=380, i=1) -->
  <g transform="translate(330, 140)">
    <rect x="0" y="20" width="100" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="0" y="20" width="100" height="4" rx="2" fill="#a3e635" />
    <text x="50" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9" font-family="system-ui">Normal</text>
    <text x="50" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#a3e635" font-family="system-ui">6mg</text>
    <!-- Strength dots: i=1, dots 0-1 filled, 2-4 empty -->
    <circle cx="25" cy="108" r="4" fill="#a3e635" />
    <circle cx="37" cy="108" r="4" fill="#a3e635" />
    <circle cx="49" cy="108" r="3" fill="#334155" />
    <circle cx="61" cy="108" r="3" fill="#334155" />
    <circle cx="73" cy="108" r="3" fill="#334155" />
  </g>

  <!-- Arrow 2→3 -->
  <text x="510" y="195" text-anchor="middle" font-size="16" fill="#334155" font-family="system-ui">&#x2192;</text>

  <!-- Can 3: Strong (x=580, i=2) -->
  <g transform="translate(530, 140)">
    <rect x="0" y="20" width="100" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="0" y="20" width="100" height="4" rx="2" fill="#facc15" />
    <text x="50" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9" font-family="system-ui">Strong</text>
    <text x="50" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#facc15" font-family="system-ui">8mg</text>
    <!-- Strength dots: i=2, dots 0-2 filled, 3-4 empty -->
    <circle cx="25" cy="108" r="4" fill="#facc15" />
    <circle cx="37" cy="108" r="4" fill="#facc15" />
    <circle cx="49" cy="108" r="4" fill="#facc15" />
    <circle cx="61" cy="108" r="3" fill="#334155" />
    <circle cx="73" cy="108" r="3" fill="#334155" />
  </g>

  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#94a3b8" font-family="system-ui">Start mild, find your sweet spot</text>
  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Most beginners settle between 4-8mg after their first few cans</text>
</svg>
