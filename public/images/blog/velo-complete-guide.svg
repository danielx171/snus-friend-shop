<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="veloBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" />
      <stop offset="100%" stop-color="#161d2b" />
    </linearGradient>
    <linearGradient id="veloCanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB8A6" />
      <stop offset="100%" stop-color="#0F9A8C" />
    </linearGradient>
    <linearGradient id="veloCanMango" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A50" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
    <linearGradient id="veloCanBerry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#C41C8C" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#veloBg)" />

  <!-- Title Section -->
  <text
    x="400"
    y="50"
    font-size="72"
    font-weight="900"
    text-anchor="middle"
    fill="#ffffff"
    font-family="system-ui"
  >
    VELO
  </text>
  <text
    x="400"
    y="90"
    font-size="18"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="system-ui"
  >
    BY BAT • 53 PRODUCTS
  </text>

  <!-- GLOBAL #2 badge -->
  <circle cx="650" cy="70" r="20" fill="#E040FB" />
  <text
    x="650"
    y="73"
    font-size="11"
    font-weight="bold"
    text-anchor="middle"
    fill="#ffffff"
    font-family="system-ui"
  >
    #2
  </text>

  <!-- Can 1: Mighty Peppermint -->
  <g transform="translate(150, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#veloCanMint)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#veloCanMint)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#0F9A8C" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="18"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      VELO
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      13MG
    </text>
  </g>

  <text
    x="185"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
