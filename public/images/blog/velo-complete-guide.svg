    Peppermint
  </text>

  <!-- Can 2: Tropical Mango -->
  <g transform="translate(360, 150)">
    <ellipse cx="35" cy="10" rx="28" ry="8" fill="url(#veloCanMango)" opacity="0.3" />
    <rect x="7" y="10" width="56" height="80" fill="url(#veloCanMango)" rx="4" />
    <ellipse cx="35" cy="90" rx="28" ry="8" fill="#FF6B35" />
    <rect x="12" y="15" width="8" height="70" fill="#ffffff" opacity="0.15" rx="2" />
    <text
      x="35"
      y="50"
      font-size="18"
      font-weight="bold"
      text-anchor="middle"
      fill="#ffffff"
      font-family="system-ui"
    >
      VELO
    </text>
    <rect x="15" y="70" width="40" height="12" fill="#1e293b" rx="2" stroke="#334155" stroke-width="1" />
    <text
      x="35"
      y="78"
      font-size="10"
      font-weight="bold"
      text-anchor="middle"
      fill="#a3e635"
      font-family="system-ui"
    >
      13MG
    </text>
  </g>

  <text
    x="395"
    y="250"
    font-size="14"
    font-weight="600"
    text-anchor="middle"
    fill="#64748b"
    font-family="system-ui"
