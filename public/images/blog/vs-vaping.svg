<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0c1018" />

  <!-- Left side - Pouches -->
  <rect x="0" y="0" width="390" height="400" fill="#0c1018" />

  <!-- Pouch can -->
  <g transform="translate(120, 100)">
    <ellipse cx="80" cy="100" rx="55" ry="18" fill="#334155" />
    <rect x="25" y="40" width="110" height="60" fill="#1e293b" rx="3" />
    <ellipse cx="80" cy="40" rx="55" ry="18" fill="#334155" />
    <ellipse cx="80" cy="40" rx="48" ry="14" fill="#475569" />
    <text x="80" y="48" text-anchor="middle" font-size="16" fill="#a3e635" font-family="system-ui">&#x2713;</text>
  </g>

  <text x="200" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#a3e635" font-family="system-ui">Nicotine Pouches</text>
  <text x="200" y="295" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">No device needed</text>
  <text x="200" y="312" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">No smoke or vapour</text>
  <text x="200" y="329" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">Use anywhere</text>
  <text x="200" y="346" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="system-ui">No charging</text>

  <!-- Divider -->
  <line x1="400" y1="40" x2="400" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="400" cy="200" r="20" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="400" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8" font-family="system-ui">VS</text>

  <!-- Right side - Vaping -->
  <rect x="410" y="0" width="390" height="400" fill="#0c1018" />

  <!-- Vape device -->
  <g transform="translate(520, 80)">
    <rect x="50" y="30" width="28" height="100" rx="8" fill="#475569" />
    <rect x="54" y="36" width="20" height="30" rx="3" fill="#334155" />
    <rect x="56" y="20" width="16" height="14" rx="4" fill="#64748b" />
    <circle cx="64" cy="85" r="6" fill="#64748b" />
    <ellipse cx="64" cy="8" rx="20" ry="10" fill="#94a3b8" opacity="0.15" />
    <ellipse cx="70" cy="-5" rx="25" ry="12" fill="#94a3b8" opacity="0.1" />
    <ellipse cx="58" cy="-15" rx="18" ry="10" fill="#94a3b8" opacity="0.06" />
  </g>

  <text x="600" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#64748b" font-family="system-ui">Vaping</text>
  <text x="600" y="295" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Requires device + liquid</text>
  <text x="600" y="312" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Produces visible vapour</text>
  <text x="600" y="329" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Restricted in many places</text>
  <text x="600" y="346" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui">Needs regular charging</text>
</svg>
