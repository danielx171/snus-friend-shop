<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0c1018" />

  <!-- Iceberg/mountain silhouette background -->
  <path
    d="M 0 180 L 100 80 L 150 120 L 200 60 L 280 100 L 320 50 L 400 150 L 400 300 L 0 300 Z"
    fill="#001a33"
    opacity="0.3"
  />

  <!-- Frost crystal decorations -->
  <g opacity="0.4">
    <!-- Top left crystals -->
    <line x1="50" y1="30" x2="50" y2="50" stroke="#00D4FF" stroke-width="1" />
    <line x1="40" y1="40" x2="60" y2="40" stroke="#00D4FF" stroke-width="1" />
    <line x1="45" y1="35" x2="55" y2="45" stroke="#00D4FF" stroke-width="1" />
    <line x1="55" y1="35" x2="45" y2="45" stroke="#00D4FF" stroke-width="1" />

    <!-- Right side crystals -->
    <line x1="330" y1="80" x2="330" y2="100" stroke="#00D4FF" stroke-width="1" />
    <line x1="320" y1="90" x2="340" y2="90" stroke="#00D4FF" stroke-width="1" />
  </g>

  <!-- Small can: 6mg -->
  <g transform="translate(70, 140)">
    <rect x="0" y="0" width="30" height="60" rx="3" fill="#00D4FF" />
    <rect x="2" y="2" width="6" height="56" rx="2" fill="#7FE5FF" opacity="0.7" />
    <rect x="3" y="15" width="24" height="30" fill="#001a33" />
    <text x="15" y="28" font-size="5" fill="#00D4FF" text-anchor="middle" font-weight="bold">
      6mg
    </text>
    <text x="15" y="35" font-size="2.5" fill="#f1f5f9" text-anchor="middle">
      MINT
    </text>
  </g>

  <!-- Medium can: 30mg -->
  <g transform="translate(160, 100)">
    <rect x="0" y="0" width="40" height="100" rx="4" fill="#00D4FF" />
    <rect x="2" y="2" width="8" height="96" rx="2" fill="#7FE5FF" opacity="0.7" />
    <rect x="3" y="25" width="34" height="50" fill="#001a33" />
    <text x="20" y="45" font-size="7" fill="#00D4FF" text-anchor="middle" font-weight="bold">
      30mg
    </text>
    <text x="20" y="55" font-size="3" fill="#f1f5f9" text-anchor="middle">
      EXTREME
    </text>
  </g>

  <!-- Large can: 40mg -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="45" height="120" rx="4" fill="#00D4FF" />
    <rect x="2" y="2" width="9" height="116" rx="2" fill="#7FE5FF" opacity="0.7" />
    <rect x="3" y="30" width="39" height="60" fill="#001a33" />
    <text x="22.5" y="55" font-size="8" fill="#00D4FF" text-anchor="middle" font-weight="bold">
      40mg
    </text>
    <text x="22.5" y="67" font-size="3.5" fill="#f1f5f9" text-anchor="middle">
      MAX
    </text>
  </g>

  <!-- Glow effect around cans -->
  <circle cx="130" cy="170" r="80" fill="#00D4FF" opacity="0.05" />

  <!-- Temperature indicator -->
  <g transform="translate(340, 240)">
    <text x="0" y="0" font-size="9" fill="#00D4FF" font-weight="bold" text-anchor="end">
      -100°C
    </text>
    <circle cx="-30" cy="-3" r="5" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Title and subtitle -->
  <text x="200" y="260" font-size="18" fill="#00D4FF" text-anchor="middle" font-weight="bold">
    ICEBERG
  </text>
  <text x="200" y="280" font-size="11" fill="#cbd5e1" text-anchor="middle">
    6-40MG
  </text>
</svg>
