version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "toolchain"
    commit-message:
      prefix: "deps"
    groups:
      test-and-lint:
        patterns:
          - "jsdom"
          - "vitest"
          - "@testing-library/*"
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "globals"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      astro-and-supabase:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "@supabase/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@tailwindcss/vite"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
